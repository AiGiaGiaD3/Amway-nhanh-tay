<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ô Chữ Giá Trị · Team Building Đà Lạt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#061736; --navy2:#0b2657; --blue:#1756b8; --blue2:#2f7de1; --sky:#5cc2ff;
  --green:#1fa46a; --mint:#7be0b0; --gold:#ffc443; --gold2:#ff9f1c; --coral:#ff5d5d;
  --ink:#0a1f44; --paper:#f7f9fd; --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--navy);color:#fff;font-family:'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
input{font-family:inherit}

/* ================= BACKGROUND ================= */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(120% 90% at 50% 0%, #12357a 0%, #0a245a 35%, #061736 75%);}
#bgImage{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1s}
#bgImage.on{opacity:.38}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen;animation:drift 26s ease-in-out infinite alternate}
.b1{width:48vw;height:48vw;left:-12vw;top:-14vw;background:#1f6bff}
.b2{width:38vw;height:38vw;right:-10vw;top:10vh;background:#14b07a;animation-duration:32s;opacity:.35}
.b3{width:30vw;height:30vw;left:35vw;bottom:-14vw;background:#ffb02e;animation-duration:22s;opacity:.25}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,4vh) scale(1.12)}100%{transform:translate(-4vw,8vh) scale(.95)}}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.4px);background-size:28px 28px;
  mask-image:radial-gradient(80% 70% at 50% 40%,#000 30%,transparent 100%);-webkit-mask-image:radial-gradient(80% 70% at 50% 40%,#000 30%,transparent 100%)}
.rings{position:absolute;width:120vh;height:120vh;left:50%;top:46%;transform:translate(-50%,-50%);pointer-events:none}
.rings i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.06);animation:ring 9s linear infinite}
.rings i:nth-child(2){inset:12%;animation-duration:13s;border-style:dashed;border-color:rgba(92,194,255,.12)}
.rings i:nth-child(3){inset:26%;animation-duration:17s;border-color:rgba(255,196,67,.08)}
@keyframes ring{to{transform:rotate(360deg)}}
.cloud{position:absolute;opacity:.10;animation:cloud linear infinite}
@keyframes cloud{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
#hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:34vh}
#particles,#fx{position:fixed;inset:0;pointer-events:none}
#particles{z-index:1}
#fx{z-index:90}
.floaty{position:absolute;opacity:.13;animation:floaty 14s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3vh) rotate(12deg)}}

/* ================= LAYOUT ================= */
.screen{position:fixed;inset:0;z-index:5;display:none}
.screen.show{display:flex}

/* ---- intro ---- */
#intro{flex-direction:column;align-items:center;justify-content:center;gap:3.4vh;padding:4vh 4vw}
.logoSlot{height:8vh;display:none}
.logoSlot.on{display:block}
.kicker{display:inline-flex;align-items:center;gap:1vw;font-weight:700;letter-spacing:.5em;font-size:1.6vh;color:var(--sky);text-transform:uppercase}
.kicker:before,.kicker:after{content:"";width:4vw;height:2px;background:linear-gradient(90deg,transparent,var(--sky))}
.kicker:after{transform:scaleX(-1)}
.titleWrap{position:relative;text-align:center}
.titleWrap .rays{position:absolute;left:50%;top:50%;width:90vh;height:90vh;transform:translate(-50%,-50%);border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 6deg,transparent 6deg 18deg);
  mask-image:radial-gradient(circle,#000 10%,transparent 65%);-webkit-mask-image:radial-gradient(circle,#000 10%,transparent 65%);animation:ring 40s linear infinite;z-index:-1}
.t1{font-size:15vh;font-weight:900;line-height:1.12;padding-top:.08em;letter-spacing:-.02em;
  background:linear-gradient(100deg,#fff 0%,#bfe6ff 30%,#fff 50%,#ffe39b 70%,#fff 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite;filter:drop-shadow(0 .6vh 3vh rgba(47,125,225,.6))}
.t2{margin-top:1.4vh;font-size:4.6vh;font-weight:800;letter-spacing:.32em;color:var(--gold);text-shadow:0 0 3vh rgba(255,196,67,.45)}
@keyframes shimmer{to{background-position:-250% 0}}
.tagline{display:flex;gap:1.2vw;font-size:2vh;font-weight:600;color:#cfe3ff}
.tagline span{padding:.8vh 1.4vw;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px)}
.setup{display:flex;gap:2vw;align-items:stretch;margin-top:1vh}
.panel{flex:none;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:2.4vh 1.6vw;backdrop-filter:blur(14px);box-shadow:0 2vh 6vh rgba(0,0,0,.35)}
.panel h4{font-size:1.5vh;letter-spacing:.25em;color:var(--sky);margin-bottom:1.6vh;font-weight:700}
.stepper{display:flex;align-items:center;gap:1vw;margin-bottom:1.6vh}
.stepper button{width:4.4vh;height:4.4vh;border-radius:50%;background:rgba(255,255,255,.12);font-size:2.6vh;font-weight:800;transition:.2s}
.stepper button:hover{background:var(--blue2);transform:scale(1.1)}
.stepper b{font-size:4vh;min-width:4vh;text-align:center}
.teamInputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8vh .8vw;width:24vw}
.teamInputs label{display:flex;align-items:center;gap:.6vw;background:rgba(0,0,0,.18);border-radius:12px;padding:.6vh .7vw;border:1px solid rgba(255,255,255,.08)}
.teamInputs i{width:1.6vh;height:1.6vh;border-radius:50%;flex:none;box-shadow:0 0 1vh currentColor}
.teamInputs input{flex:1;min-width:0;background:none;border:0;color:#fff;font-size:1.8vh;font-weight:600;outline:none}
.roundBtns{display:flex;flex-direction:column;gap:1.6vh;width:24vw}
.roundBtn{position:relative;overflow:hidden;text-align:left;border-radius:20px;padding:2.2vh 1.6vw;display:flex;align-items:center;gap:1.2vw;transition:transform .25s,box-shadow .25s}
.roundBtn:hover{transform:translateY(-.5vh) scale(1.02)}
.roundBtn.warm{background:linear-gradient(120deg,#1fa46a,#16805a);box-shadow:0 1.4vh 4vh rgba(31,164,106,.4)}
.roundBtn.main{background:linear-gradient(120deg,#2f7de1,#1240a0);box-shadow:0 1.4vh 4vh rgba(47,125,225,.45)}
.roundBtn .n{font-size:5.4vh;font-weight:900;opacity:.9;width:6vh}
.roundBtn small{display:block;font-size:1.5vh;opacity:.85;font-weight:500;margin-top:.3vh}
.roundBtn strong{font-size:2.6vh;font-weight:800;letter-spacing:.04em}
.roundBtn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sheen 3.6s ease-in-out infinite}
.roundBtn.main:after{animation-delay:1.8s}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
.tinyLinks{display:flex;gap:1.2vw;font-size:1.5vh;color:#9fc1ee}
.tinyLinks button{text-decoration:underline;text-underline-offset:3px;opacity:.85}
.tinyLinks button:hover{opacity:1;color:#fff}

/* ---- game ---- */
#game{padding:2vh 1.6vw 2vh;gap:1.4vw}
.gameMain{flex:1;display:flex;flex-direction:column;gap:1.6vh;min-width:0}
.topbar{display:flex;align-items:center;gap:1.2vw;height:7vh}
.roundChip{padding:1vh 1.4vw;border-radius:99px;font-weight:800;font-size:2vh;letter-spacing:.14em;background:linear-gradient(120deg,var(--green),#138a57);box-shadow:0 .8vh 2.4vh rgba(31,164,106,.35);white-space:nowrap}
.roundChip.main{background:linear-gradient(120deg,var(--blue2),var(--blue));box-shadow:0 .8vh 2.4vh rgba(47,125,225,.45)}
.gTitle{font-weight:900;font-size:3.4vh;letter-spacing:.06em;white-space:nowrap}
.gTitle span{color:var(--gold)}
.topLogo{height:5vh;display:none}.topLogo.on{display:block}
.spacer{flex:1}
.progress{display:flex;gap:.8vw;align-items:center;font-weight:700;font-size:1.8vh}
.pill{padding:.8vh 1vw;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);display:flex;gap:.5vw;align-items:center;white-space:nowrap}
.pill b{color:var(--gold);font-size:2.2vh}
.iconBtn{width:5vh;height:5vh;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;transition:.2s}
.iconBtn:hover{background:rgba(255,255,255,.22);transform:translateY(-2px)}
.iconBtn svg{width:2.4vh;height:2.4vh}
.board{flex:1;display:grid;gap:1.4vh 1vw;min-height:0}

/* ---- tiles ---- */
.tile{position:relative;perspective:1400px;container-type:size;cursor:pointer;animation:tileIn .7s cubic-bezier(.2,.9,.25,1.3) backwards}
@keyframes tileIn{from{opacity:0;transform:translateY(6vh) scale(.4) rotate(-12deg)}}
.tile-inner{position:absolute;inset:0;transition:transform .75s cubic-bezier(.3,1.35,.45,1);transform-style:preserve-3d}
.tile.up .tile-inner,.tile.matched .tile-inner,.tile.gift-open .tile-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r);overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{background:
  radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.28),transparent 45%),
  linear-gradient(150deg,#2f7de1 0%,#1449a8 55%,#0b2a66 100%);
  border:2px solid rgba(255,255,255,.22);box-shadow:0 1.2vh 3vh rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
  display:grid;place-items:center;transition:box-shadow .3s, filter .3s}
.back:before{content:"";position:absolute;inset:7%;border-radius:calc(var(--r) - 6px);border:1.5px dashed rgba(255,255,255,.22)}
.back .pat{position:absolute;inset:0;opacity:.18;background-image:
  radial-gradient(circle at 0 0,transparent 9px,rgba(255,255,255,.55) 10px,transparent 11px),
  radial-gradient(circle at 100% 100%,transparent 9px,rgba(255,255,255,.55) 10px,transparent 11px);background-size:22px 22px}
.back .num{position:relative;font-size:48cqh;font-weight:900;line-height:1;color:#fff;text-shadow:0 .5vh 0 rgba(6,23,54,.45),0 0 3vh rgba(92,194,255,.9)}
.back .corner{position:absolute;width:13cqh;height:13cqh;opacity:.85}
.back .c1{top:8%;left:6%}.back .c2{bottom:8%;right:6%;transform:rotate(180deg)}
.back .shine{position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg)}
.tile:not(.up):not(.matched):not(.gift-open):hover .back{box-shadow:0 0 0 3px var(--gold),0 1.6vh 4vh rgba(255,196,67,.35);filter:brightness(1.12)}
.tile:not(.up):not(.matched):not(.gift-open):hover .tile-inner{transform:translateY(-1vh) rotateX(8deg)}
.tile:not(.up):not(.matched):not(.gift-open):hover .shine{animation:sheenT .9s ease}
@keyframes sheenT{to{left:130%}}
.board.idle .tile:not(.up):not(.matched):not(.gift-open) .back{animation:breathe 4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes breathe{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}

.front{transform:rotateY(180deg);background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;
  box-shadow:0 1.2vh 3vh rgba(0,0,0,.35);border:3px solid #fff}
.front .fnum{position:absolute;top:5%;left:5%;font-size:9cqh;font-weight:800;color:#8aa0c4;z-index:2}
.front .word{font-weight:900;text-align:center;line-height:1.08;padding:10% 8%;overflow:hidden;background:linear-gradient(160deg,#0b2a66,#1f6ad6);-webkit-background-clip:text;background-clip:text;color:transparent;width:100%;max-height:100%}
.front .text{font-weight:600;text-align:center;line-height:1.3;padding:11% 7% 9%;overflow:hidden;width:100%;max-height:100%;color:#163463}
.front .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.front .icon{height:70cqh;width:70cqh;object-fit:contain;filter:drop-shadow(0 .6vh 1vh rgba(10,31,68,.15))}
.front.giftF{background:radial-gradient(circle at 50% 40%,#fff6d8,#ffd56a 55%,#ffad2e);border-color:#fff1c2}
.front.giftF svg{width:62cqh;height:62cqh;animation:giftBob 1.6s ease-in-out infinite}
.front.giftF .gl{position:absolute;bottom:6%;font-weight:900;font-size:10cqh;letter-spacing:.12em;color:#8a4b00}
@keyframes giftBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6%) rotate(4deg)}}
.tile.matched .front{padding-bottom:15cqh;border-color:var(--green);box-shadow:0 0 0 3px rgba(31,164,106,.35),0 0 3vh rgba(31,164,106,.45)}
.tile.matched .front:after{content:attr(data-name);position:absolute;left:0;right:0;bottom:0;padding:.6vh .4vw;background:linear-gradient(90deg,var(--green),#12895a);color:#fff;font-weight:800;font-size:max(1.2vh,10cqh);letter-spacing:.06em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3}
.tile.matched .badge{display:grid}
.badge{display:none;position:absolute;top:-1.2vh;right:-1.2vh;width:4.4vh;height:4.4vh;border-radius:50%;background:var(--green);border:3px solid #fff;place-items:center;z-index:5;box-shadow:0 .6vh 1.6vh rgba(0,0,0,.35);animation:pop .5s cubic-bezier(.3,1.8,.5,1) backwards;animation-delay:.3s}
.badge svg{width:2.4vh;height:2.4vh}
@keyframes pop{from{transform:scale(0)}}
.tile.wrong .front{border-color:var(--coral);animation:shake .5s}
@keyframes shake{20%,60%{transform:rotateY(180deg) translateX(-1vh)}40%,80%{transform:rotateY(180deg) translateX(1vh)}}
.tile.good .tile-inner{animation:jump .7s ease}
@keyframes jump{0%{transform:rotateY(180deg) scale(1)}40%{transform:rotateY(180deg) scale(1.12)}100%{transform:rotateY(180deg) scale(1)}}
.tile.matched,.tile.gift-open{cursor:default}
.tile.gift-open .front{filter:saturate(.75) brightness(.95)}
.tile.gift-open .front svg{animation:none;opacity:.6}

/* ---- scoreboard ---- */
.side{width:19vw;display:flex;flex-direction:column;gap:1.2vh;min-height:0}
.sideHead{height:7vh;display:flex;align-items:center;justify-content:space-between;font-weight:800;letter-spacing:.2em;font-size:1.7vh;color:var(--sky)}
.teams{flex:1;display:flex;flex-direction:column;gap:1vh;min-height:0}
.team{position:relative;flex:1;max-height:12vh;display:flex;align-items:center;gap:.9vw;padding:0 1vw;border-radius:18px;cursor:pointer;
  background:linear-gradient(120deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.12);transition:all .45s cubic-bezier(.3,1.4,.5,1)}
.team .dot{width:4.2vh;height:4.2vh;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:900;font-size:2vh;color:#fff;box-shadow:0 .6vh 1.6vh rgba(0,0,0,.3)}
.team .nm{flex:1;min-width:0;font-weight:700;font-size:2vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .sc{font-weight:900;font-size:4vh;font-variant-numeric:tabular-nums;min-width:5vh;text-align:right}
.team.cur{transform:scale(1.04) translateX(-.6vw);background:linear-gradient(120deg,rgba(255,196,67,.3),rgba(255,159,28,.08));border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,196,67,.25),0 1.2vh 3.4vh rgba(255,170,40,.3)}
.team.cur:before{content:"ĐANG CHƠI";position:absolute;top:-1vh;left:1vw;font-size:1.1vh;font-weight:800;letter-spacing:.18em;background:var(--gold);color:#5a3300;padding:.2vh .6vw;border-radius:99px}
.team .adj{position:absolute;right:.6vw;bottom:.4vh;display:flex;gap:.3vw;opacity:0;transition:.2s}
.team:hover .adj{opacity:1}
.team .adj button{font-size:1.2vh;font-weight:800;padding:.2vh .5vw;border-radius:8px;background:rgba(0,0,0,.35)}
.team .adj button:hover{background:var(--blue2)}
.team.bump .sc{animation:bump .6s ease}
@keyframes bump{40%{transform:scale(1.5);color:var(--gold)}}
.nextBtn{height:7vh;border-radius:18px;font-weight:800;font-size:2vh;letter-spacing:.08em;background:linear-gradient(120deg,var(--gold),var(--gold2));color:#4a2a00;box-shadow:0 1vh 3vh rgba(255,170,40,.35);display:flex;align-items:center;justify-content:center;gap:.6vw;transition:.2s}
.nextBtn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.nextBtn kbd{font-family:inherit;font-size:1.2vh;padding:.2vh .5vw;border-radius:6px;background:rgba(0,0,0,.12)}

/* ================= OVERLAYS ================= */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(3,10,28,.62);backdrop-filter:blur(10px)}
.overlay.show{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.burstRays{position:absolute;left:50%;top:50%;width:160vh;height:160vh;transform:translate(-50%,-50%);border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,214,110,.16) 0 7deg,transparent 7deg 20deg);
  mask-image:radial-gradient(circle,#000 5%,transparent 60%);-webkit-mask-image:radial-gradient(circle,#000 5%,transparent 60%);animation:ring 30s linear infinite;pointer-events:none}
.burstRays.blue{background:repeating-conic-gradient(from 0deg,rgba(92,194,255,.16) 0 7deg,transparent 7deg 20deg)}
.modal{position:relative;width:min(82vw,150vh);border-radius:32px;padding:4.4vh 3vw 3.6vh;text-align:center;
  background:linear-gradient(165deg,#ffffff 0%,#eef4ff 100%);color:var(--ink);box-shadow:0 4vh 12vh rgba(0,0,0,.55);animation:modalIn .7s cubic-bezier(.25,1.6,.45,1)}
@keyframes modalIn{from{transform:scale(.3) rotate(-6deg);opacity:0}}
.mChip{display:inline-flex;align-items:center;gap:.6vw;padding:.9vh 1.4vw;border-radius:99px;background:var(--green);color:#fff;font-weight:800;font-size:2vh;letter-spacing:.1em;box-shadow:0 .8vh 2vh rgba(31,164,106,.4)}
.mTitle{margin:1.6vh 0 2.6vh;font-size:8.4vh;font-weight:900;line-height:1;letter-spacing:.02em;background:linear-gradient(120deg,#0b2a66,#1f6ad6 60%,#1fa46a);-webkit-background-clip:text;background-clip:text;color:transparent;animation:titleIn .8s .25s cubic-bezier(.25,1.6,.45,1) backwards}
@keyframes titleIn{from{transform:translateY(3vh) scale(.6);opacity:0}}
.mPair{display:flex;gap:2vw;align-items:stretch;justify-content:center}
.mCard{flex:1;max-width:46%;min-height:32vh;border-radius:22px;background:#fff;border:2px solid #dbe6f7;box-shadow:0 1.2vh 3vh rgba(10,31,68,.12);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;animation:cardIn .7s cubic-bezier(.25,1.5,.45,1) backwards}
.mCard:nth-child(1){animation-delay:.4s}.mCard:nth-child(3){animation-delay:.55s}
@keyframes cardIn{from{transform:translateY(5vh) rotate(-4deg);opacity:0}}
.mCard .word{font-size:6vh;font-weight:900;color:var(--blue);padding:3vh}
.mCard .text{font-size:3vh;font-weight:600;line-height:1.4;padding:3vh 2.4vw;color:#163463}
.mCard img.photo{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.mCard img.icon{width:24vh;height:24vh;object-fit:contain}
.mLink{align-self:center;width:7vh;height:7vh;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;flex:none;box-shadow:0 1vh 2.4vh rgba(255,159,28,.45);animation:pop .6s .7s cubic-bezier(.3,1.8,.5,1) backwards}
.mLink svg{width:3.6vh;height:3.6vh}
.mDeco{position:absolute;width:30vh;height:30vh;right:-6vh;top:-8vh;opacity:.07;pointer-events:none;color:var(--blue)}
.mDeco2{position:absolute;width:20vh;height:20vh;left:-4vh;bottom:-6vh;opacity:.06;pointer-events:none;color:var(--green);transform:rotate(-18deg)}
.mBtns{margin-top:3vh;display:flex;gap:1vw;justify-content:center}
.btn{padding:1.5vh 2.6vw;border-radius:99px;font-weight:800;font-size:2.1vh;letter-spacing:.06em;background:linear-gradient(120deg,var(--blue2),var(--blue));color:#fff;box-shadow:0 1vh 2.6vh rgba(23,86,184,.4);transition:.2s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn.ghost{background:#e6eefb;color:var(--blue);box-shadow:none}
.btn.gold{background:linear-gradient(120deg,var(--gold),var(--gold2));color:#4a2a00;box-shadow:0 1vh 2.6vh rgba(255,159,28,.4)}
.plus{position:absolute;top:2.4vh;right:2.4vw;font-size:5vh;font-weight:900;color:var(--green);animation:plus 1.2s .6s ease backwards}
@keyframes plus{from{transform:translateY(3vh) scale(.3);opacity:0}60%{transform:translateY(-1vh) scale(1.2)}}

/* gift modal */
.giftStage{position:relative;display:flex;flex-direction:column;align-items:center;gap:2vh;text-align:center}
.giftStage .bigGift{width:38vh;height:38vh;filter:drop-shadow(0 3vh 5vh rgba(0,0,0,.45))}
.giftStage.shaking .bigGift{animation:gShake .14s linear infinite}
@keyframes gShake{0%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(5deg) translateY(-1vh)}100%{transform:rotate(-5deg)}}
.bigGift .lid{transform-origin:50% 60%;transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
.giftStage.open .lid{transform:translateY(-30%) rotate(-18deg)}
.giftStage .glow{position:absolute;top:8vh;width:30vh;height:30vh;border-radius:50%;background:radial-gradient(circle,#fff7cf,rgba(255,196,67,.0) 70%);opacity:0;transition:opacity .4s}
.giftStage.open .glow{opacity:1;animation:pulseG 1.4s ease-in-out infinite}
@keyframes pulseG{50%{transform:scale(1.25)}}
.gTitle2{font-size:9vh;font-weight:900;line-height:1;background:linear-gradient(120deg,#fff3c4,var(--gold),#ffffff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .6vh 2vh rgba(255,170,40,.6));opacity:0;transform:scale(.4);transition:all .6s cubic-bezier(.25,1.6,.45,1)}
.gSub{font-size:2.8vh;font-weight:600;color:#ffe9b0;opacity:0;transition:opacity .5s .3s}
.giftStage.open .gTitle2{opacity:1;transform:none}
.giftStage.open .gSub{opacity:1}
.giftStage .mBtns{opacity:0;transition:opacity .4s .5s}
.giftStage.open .mBtns{opacity:1}
.qAdj{display:flex;gap:.6vw;justify-content:center}
.qAdj button{padding:1vh 1.4vw;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);font-weight:800;font-size:1.9vh}
.qAdj button:hover{background:rgba(255,255,255,.3)}

/* turn banner */
#turnBanner{position:fixed;left:0;right:0;top:42%;z-index:60;pointer-events:none;display:flex;justify-content:center;opacity:0}
#turnBanner.go{animation:banner 1.6s cubic-bezier(.3,.9,.3,1)}
#turnBanner div{padding:2.4vh 6vw;font-size:6vh;font-weight:900;letter-spacing:.06em;color:#fff;border-radius:20px;box-shadow:0 2vh 6vh rgba(0,0,0,.45);transform:skewX(-8deg)}
@keyframes banner{0%{opacity:0;transform:translateX(-60vw)}18%{opacity:1;transform:translateX(0)}78%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(60vw)}}

/* final */
.final{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2vh}
.final h2{font-size:3vh;letter-spacing:.4em;color:var(--sky);font-weight:800}
.final h1{font-size:10vh;font-weight:900;line-height:1;background:linear-gradient(120deg,#fff,var(--gold),#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s linear infinite}
.podium{display:flex;align-items:flex-end;gap:1.6vw;margin-top:2vh}
.pod{width:15vw;display:flex;flex-direction:column;align-items:center;gap:1vh;animation:podIn .9s cubic-bezier(.25,1.5,.45,1) backwards}
.pod .who{font-weight:900;font-size:3vh;padding:.4vh 1vw;border-radius:99px;background:rgba(255,255,255,.92)}
.pod .pts{font-weight:900;font-size:4vh;color:var(--gold)}
.pod .blk{width:100%;border-radius:18px 18px 6px 6px;display:grid;place-items:center;font-size:7vh;font-weight:900;color:rgba(255,255,255,.95);box-shadow:inset 0 -1vh 0 rgba(0,0,0,.15),0 2vh 5vh rgba(0,0,0,.35)}
.pod.p1 .blk{height:26vh;background:linear-gradient(180deg,#ffd463,#f29a12)}
.pod.p2 .blk{height:19vh;background:linear-gradient(180deg,#d9e6f7,#8ea9cf)}
.pod.p3 .blk{height:14vh;background:linear-gradient(180deg,#f0b48a,#c4743f)}
.pod.p1{animation-delay:.9s}.pod.p2{animation-delay:.4s}.pod.p3{animation-delay:.1s}
.pod .crown{width:7vh;height:7vh;animation:giftBob 1.8s ease-in-out infinite}
@keyframes podIn{from{transform:translateY(30vh);opacity:0}}
.rest{display:flex;gap:1vw;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:1.9vh;color:#cfe0f8}
.rest span{padding:.6vh 1vw;border-radius:99px;background:rgba(255,255,255,.08)}

/* confirm + settings */
.box{background:#fff;color:var(--ink);border-radius:24px;padding:3.4vh 2.6vw;min-width:36vw;text-align:center;animation:modalIn .5s cubic-bezier(.25,1.6,.45,1)}
.box h3{font-size:3vh;font-weight:900;margin-bottom:1.2vh}
.box p{font-size:2vh;color:#47608a;margin-bottom:2.4vh}
.box .row{display:flex;align-items:center;justify-content:space-between;gap:1vw;text-align:left;padding:1.4vh 0;border-bottom:1px solid #e6edf8;font-size:1.9vh;font-weight:600}
.box .row small{display:block;color:#7b8fb2;font-weight:500;font-size:1.5vh}
.box input[type=file]{display:none}
.help{font-size:1.6vh;color:#6a7fa5;line-height:1.7;text-align:left;margin-top:1.6vh}
.help kbd{font-family:inherit;font-weight:800;padding:.1vh .5vw;border-radius:6px;background:#e9f0fb;color:var(--blue)}
</style>
</head>
<body>

<!-- ============ BACKGROUND ============ -->
<div id="bg">
  <div id="bgImage"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="dots"></div>
  <div class="rings"><i></i><i></i><i></i></div>
  <div id="clouds"></div>
  <div id="floaties"></div>
  <svg id="hills" viewBox="0 0 1600 340" preserveAspectRatio="none">
    <defs>
      <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b4fa6" stop-opacity=".55"/><stop offset="1" stop-color="#061736" stop-opacity=".2"/></linearGradient>
      <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11407f" stop-opacity=".75"/><stop offset="1" stop-color="#061736"/></linearGradient>
      <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c3a5e"/><stop offset="1" stop-color="#05142f"/></linearGradient>
      <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe8ff" stop-opacity="0"/><stop offset=".6" stop-color="#cfe8ff" stop-opacity=".10"/><stop offset="1" stop-color="#cfe8ff" stop-opacity="0"/></linearGradient>
    </defs>
    <path d="M0 150 L120 90 L230 140 L360 60 L480 130 L600 80 L720 140 L860 50 L980 120 L1100 70 L1240 130 L1380 60 L1500 110 L1600 80 L1600 340 L0 340Z" fill="url(#h1)"/>
    <rect x="0" y="120" width="1600" height="80" fill="url(#mist)"/>
    <path d="M0 220 Q 200 150 400 210 T 800 200 T 1200 190 T 1600 200 L1600 340 L0 340Z" fill="url(#h2)"/>
    <g id="pines" fill="#0a2c52" opacity=".9"></g>
    <path d="M0 290 Q 260 240 520 280 T 1040 275 T 1600 270 L1600 340 L0 340Z" fill="url(#h3)"/>

    <g stroke="#1fa46a" stroke-opacity=".22" stroke-width="2" fill="none">
      <path d="M0 305 Q 260 262 520 298 T 1040 292 T 1600 288"/>
      <path d="M0 318 Q 260 280 520 312 T 1040 306 T 1600 302"/>
      <path d="M0 330 Q 260 298 520 326 T 1040 320 T 1600 316"/>
    </g>
  </svg>
</div>
<canvas id="particles"></canvas>

<!-- ============ INTRO ============ -->
<section id="intro" class="screen show">
  <img class="logoSlot" id="logoIntro" alt="">
  <div class="kicker">Team Building · Đà Lạt</div>
  <div class="titleWrap">
    <div class="rays"></div>
    <div class="t1">Ô CHỮ</div>
    <div class="t2">GIÁ TRỊ CỐT LÕI</div>
  </div>
  <div class="tagline"><span>① Lật ô</span><span>② Ghép cặp</span><span>③ Mở hộp quà</span><span>④ Về đích</span></div>
  <div class="setup">
    <div class="panel">
      <h4>CÁC ĐỘI THI</h4>
      <div class="stepper"><button id="minusT">–</button><b id="nT">4</b><button id="plusT">+</button><span style="font-size:1.7vh;color:#a9c4ea">đội</span></div>
      <div class="teamInputs" id="teamInputs"></div>
    </div>
    <div class="roundBtns">
      <button class="roundBtn warm" data-round="warm"><span class="n">01</span><span><strong>VÒNG KHỞI ĐỘNG</strong><small>12 ô · 5 cặp · 2 hộp quà</small></span></button>
      <button class="roundBtn main" data-round="main"><span class="n">02</span><span><strong>VÒNG CHÍNH THỨC</strong><small>24 ô · 8 cặp · 8 hộp quà</small></span></button>
    </div>
  </div>
  <div class="tinyLinks"><button id="openSettings">Tuỳ chỉnh hình ảnh</button><button id="resetScores">Đặt lại điểm</button><button id="openHelp">Phím tắt cho MC</button></div>
</section>

<!-- ============ GAME ============ -->
<section id="game" class="screen">
  <div class="gameMain">
    <div class="topbar">
      <div class="roundChip" id="roundChip">VÒNG KHỞI ĐỘNG</div>
      <img class="topLogo" id="logoTop" alt="">
      <div class="gTitle">Ô CHỮ <span>GIÁ TRỊ</span></div>
      <div class="spacer"></div>
      <div class="progress">
        <div class="pill">Cặp đã ghép <b id="pairCount">0/5</b></div>
        <div class="pill">🎁 <b id="giftCount">0/2</b></div>
      </div>
      <button class="iconBtn" id="btnSound" title="Âm thanh (M)"></button>
      <button class="iconBtn" id="btnFull" title="Toàn màn hình (F)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="iconBtn" id="btnReveal" title="Mở tất cả ô"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="iconBtn" id="btnHome" title="Về màn hình chính"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></button>
    </div>
    <div class="board" id="board"></div>
  </div>
  <aside class="side">
    <div class="sideHead"><span>BẢNG ĐIỂM</span><span style="color:#fff;opacity:.6;letter-spacing:.05em;font-weight:600">+10 / cặp</span></div>
    <div class="teams" id="teams"></div>
    <button class="nextBtn" id="nextTeam">ĐỔI LƯỢT ➜ <kbd>N</kbd></button>
  </aside>
</section>

<div class="overlay" id="giftOv"></div>
<div class="overlay" id="finalOv"></div>
<div class="overlay" id="boxOv"></div>
<div id="turnBanner"><div></div></div>

let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,dur,type='sine',vol=.15,when=0,slide=0){
  if(!S.sound)return; const a=ac(); if(!a)return;
  const t=a.currentTime+when, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
function noise(dur,vol=.1,when=0,f1=800,f2=4000,roll=false){
  if(!S.sound)return; const a=ac(); if(!a)return;
  const t=a.currentTime+when, len=a.sampleRate*dur, buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++){ let v=Math.random()*2-1; if(roll){ v*= (0.55+0.45*Math.sin(i/a.sampleRate*2*Math.PI*(14+18*i/len))) * (i/len); } d[i]=v; }
  const s=a.createBufferSource(); s.buffer=buf; const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.setValueAtTime(f1,t); bp.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=a.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(bp).connect(g).connect(a.destination); s.start(t);
}
const SFX = {
  hover(){ tone(1200,.04,'sine',.03) },

  match(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,'triangle',.13,i*.08)); tone(2093,.6,'sine',.05,.42) },
  wrong(){ tone(330,.22,'square',.06,0,250); tone(247,.35,'square',.06,.18,180) },
  turn(){ noise(.45,.12,0,400,3000) ; tone(392,.12,'triangle',.06,.25); tone(587,.18,'triangle',.06,.33) },
  roll(){ noise(1.3,.16,0,300,900,true) },
  gift(){ [392,523,659,784].forEach((f,i)=>{tone(f,.9,'triangle',.11,i*.02)}); [1047,1319,1568].forEach((f,i)=>tone(f,.5,'sine',.07,.15+i*.1)); noise(.6,.1,0,3000,9000) },
  win(){ const m=[523,523,659,784,659,784,1047]; m.forEach((f,i)=>tone(f,i==6?1.2:.22,'triangle',.14,i*.16)); [262,330,392].forEach(f=>tone(f,1.6,'sine',.06,.96)) },

function buildBackground(){

    p+=`<path d="M${x} ${y-h} L${x-w} ${y} L${x+w} ${y} Z"/>`; }
  $('#pines').innerHTML=p;
  // clouds

    c+=`<svg class="cloud" style="top:${top}vh;width:${w}vw;animation-duration:${dur}s;animation-delay:${del}s" viewBox="0 0 100 40"><path fill="#fff" d="M10 34a10 10 0 0 1 4-19 14 14 0 0 1 26-6 12 12 0 0 1 22 2 10 10 0 0 1 16 6 9 9 0 0 1 12 17z"/></svg>`; }
  $('#clouds').innerHTML=c;
  // floating value icons
  const keys=Object.keys(DECO); let f='';
  for(let i=0;i<14;i++){ const k=keys[i%keys.length], s=3+Math.random()*4;

}
// particles: rising sparkles
const pc=$('#particles'), px=pc.getContext('2d'); let parts=[];
function sizeCanvas(){ [pc,$('#fx')].forEach(c=>{c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;}); }
function spawnPart(init){ return {x:Math.random()*pc.width,y:init?Math.random()*pc.height:pc.height+10,r:(Math.random()*2.2+.6)*devicePixelRatio,vy:(Math.random()*.5+.15)*devicePixelRatio,vx:(Math.random()-.5)*.25,ph:Math.random()*6.28,c:['255,255,255','255,214,110','120,200,255','130,230,180'][Math.random()*4|0]} }
function loopParts(){
  px.clearRect(0,0,pc.width,pc.height);
  for(const p of parts){ p.y-=p.vy; p.x+=p.vx+Math.sin(p.ph+=.02)*.3; if(p.y<-10)Object.assign(p,spawnPart(false));
    const a=.35+.35*Math.sin(p.ph*2); px.beginPath(); px.fillStyle=`rgba(${p.c},${a})`; px.shadowBlur=8*devicePixelRatio; px.shadowColor=`rgba(${p.c},.9)`; px.arc(p.x,p.y,p.r,0,6.28); px.fill(); }
  requestAnimationFrame(loopParts);
}
// confetti / bursts
const fc=$('#fx'), fx=fc.getContext('2d'); let conf=[]; let fxRunning=false;
const CONF_COLORS=['#ffc443','#ff9f1c','#2f7de1','#5cc2ff','#1fa46a','#7be0b0','#ffffff','#ff5d5d'];
function burst(x,y,n=60,spread=1,power=1){
  const d=devicePixelRatio; for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=(4+Math.random()*9)*power*d;
    conf.push({x:x*d,y:y*d,vx:Math.cos(a)*v*spread,vy:Math.sin(a)*v-4*d*power,g:.25*d,s:(5+Math.random()*7)*d,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:CONF_COLORS[Math.random()*CONF_COLORS.length|0],life:1,shape:Math.random()<.5?0:1}); }
  if(!fxRunning){fxRunning=true;requestAnimationFrame(loopFx);}
}
function rain(n=180){ const d=devicePixelRatio; for(let i=0;i<n;i++) conf.push({x:Math.random()*fc.width,y:-Math.random()*fc.height*.6,vx:(Math.random()-.5)*2*d,vy:(2+Math.random()*3)*d,g:.04*d,s:(6+Math.random()*8)*d,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:CONF_COLORS[Math.random()*CONF_COLORS.length|0],life:1.6,shape:Math.random()<.5?0:1});
  if(!fxRunning){fxRunning=true;requestAnimationFrame(loopFx);} }
function loopFx(){
  fx.clearRect(0,0,fc.width,fc.height);
  conf=conf.filter(p=>p.life>0&&p.y<fc.height+50);
  for(const p of conf){ p.vy+=p.g; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=.006;
    fx.save(); fx.translate(p.x,p.y); fx.rotate(p.r); fx.globalAlpha=Math.min(1,p.life); fx.fillStyle=p.c;
    if(p.shape)fx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); else {fx.beginPath();fx.arc(0,0,p.s/3,0,6.28);fx.fill();} fx.restore(); }
  if(conf.length)requestAnimationFrame(loopFx); else {fxRunning=false; fx.clearRect(0,0,fc.width,fc.height);}
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a; }
function startRound(key){
  const R=ROUNDS[key]; S.round=key; S.open=[]; S.lock=false; if(S.cur>=S.nTeams)S.cur=0;
  let list=[]; R.pairs.forEach(p=>p.items.forEach(it=>list.push({...it,pair:p.id})));
  for(let i=0;i<R.gifts;i++) list.push({t:'gift'});
  S.tiles=shuffle(list).map((x,i)=>({...x,n:i+1,state:'down'}));
  $('#roundChip').textContent=R.label; $('#roundChip').className='roundChip '+R.cls;
  const b=$('#board'); b.style.gridTemplateColumns=`repeat(${R.cols},1fr)`; b.style.gridTemplateRows=`repeat(${R.rows},1fr)`;
  renderBoard(); renderTeams(); updateProgress();
  switchScreen('game');
  setTimeout(()=>{ fitAll(); },60);
  setTimeout(()=>{ showTurn(); b.classList.add('idle'); }, 900);
}
function frontHTML(t){
  if(t.t==='gift') return `<div class="face front giftF"><span class="fnum">${t.n}</span>${GIFT_SVG(false)}<span class="gl">HỘP QUÀ</span></div>`;

  let inner='';
  if(t.t==='word') inner=`<div class="word fit" data-max="34" data-min="8">${t.v}</div>`;
  if(t.t==='text') inner=`<div class="text fit" data-max="15" data-min="5">${t.v}</div>`;

  return `<div class="face front" data-name="${nm}"><span class="fnum" ${t.t==='photo'?'style="color:#fff;text-shadow:0 1px 4px #000"':''}>${t.n}</span>${inner}</div>`;
}
const pairOf = t=>ROUNDS[S.round].pairs.find(p=>p.id===t.pair);
function renderBoard(){
  const b=$('#board'); b.classList.remove('idle');
  b.innerHTML = S.tiles.map((t,i)=>`<div class="tile" data-i="${i}" style="animation-delay:${i*45}ms;--d:${(i%7)*.5}s">
    <div class="tile-inner">
      <div class="face back"><div class="pat"></div><span class="corner c1">${ICON.corner}</span><span class="corner c2">${ICON.corner}</span><span class="num">${t.n}</span><div class="shine"></div></div>
      ${frontHTML(t)}
    </div><span class="badge">${ICON.check}</span></div>`).join('');
  b.querySelectorAll('.tile').forEach(el=>{ el.onclick=()=>clickTile(+el.dataset.i); el.onmouseenter=()=>{ if(S.tiles[+el.dataset.i].state==='down')SFX.hover(); }; });
}
function tileEl(i){ return $(`#board .tile[data-i="${i}"]`); }
// fit text into container (cqh-based max)
function fitAll(){ document.querySelectorAll('#board .fit').forEach(fitEl); }
function fitEl(el){
  const box=el.parentElement, h=box.clientHeight; if(!h)return;
  let size=+el.dataset.max*h/100; const min=+el.dataset.min*h/100;
  el.style.fontSize=size+'px';
  let guard=60; while(guard-- && size>min && (el.scrollHeight>el.clientHeight+1 || el.scrollWidth>el.clientWidth+1 || el.offsetHeight>box.clientHeight*.96)){ size*=.93; el.style.fontSize=size+'px'; }
}
addEventListener('resize',()=>{ sizeCanvas(); fitAll(); });

function clickTile(i){
  const t=S.tiles[i]; if(S.lock||t.state!=='down')return; ac();
  const el=tileEl(i);
  if(t.t==='gift'){
    S.lock=true; t.state='gift-open'; el.classList.add('gift-open'); SFX.flip();
    const r=el.getBoundingClientRect(); setTimeout(()=>burst(r.left+r.width/2,r.top+r.height/2,40,.8,.8),350);
    setTimeout(()=>openGift(),800); updateProgress(); return;
  }
  t.state='up'; el.classList.add('up'); SFX.flip(); S.open.push(i);
  setTimeout(()=>fitEl(el.querySelector('.fit')||document.createElement('i')),50);
  if(S.open.length===2){
    S.lock=true; const [a,b]=S.open.map(k=>S.tiles[k]);
    if(a.pair===b.pair){
      setTimeout(()=>{
        S.open.forEach(k=>{const e=tileEl(k); S.tiles[k].state='matched'; e.classList.remove('up'); e.classList.add('matched','good'); const ff=e.querySelector('.fit'); if(ff)setTimeout(()=>fitEl(ff),30); const r=e.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,55,.9,.9);});
        SFX.match(); addScore(S.cur,POINTS); updateProgress();
        const pair=pairOf(a); setTimeout(()=>showMatch(pair),900);
        S.open=[];
      },650);
    } else {
      setTimeout(()=>{ S.open.forEach(k=>tileEl(k).classList.add('wrong')); SFX.wrong(); },800);
      setTimeout(()=>{ S.open.forEach(k=>{const e=tileEl(k); e.classList.remove('wrong','up'); S.tiles[k].state='down';}); S.open=[]; S.lock=false; nextTeam(); },2000);
    }
  }
}
function updateProgress(){
  const R=ROUNDS[S.round]; const m=S.tiles.filter(t=>t.state==='matched').length/2; const g=S.tiles.filter(t=>t.t==='gift'&&t.state==='gift-open').length;
  $('#pairCount').textContent=`${m}/${R.pairs.length}`; $('#giftCount').textContent=`${g}/${R.gifts}`;
}
function roundDone(){ return S.tiles.filter(t=>t.t!=='gift').every(t=>t.state==='matched'); }

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function addScore(i,d){
  const t=S.teams[i], from=t.score; t.score=Math.max(0,t.score+d); saveTeams();

  if(d>0){ const r=el.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,18,.6,.5); }

function shade(hex,p){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+p*2.55,g=((n>>8)&255)+p*2.55,b=(n&255)+p*2.55; const c=v=>Math.max(0,Math.min(255,v|0)); return `rgb(${c(r)},${c(g)},${c(b)})`; }

/* ---- final ---- */
function showFinal(){
  const R=ROUNDS[S.round]; const ranked=activeTeams().map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);
  const top=[ranked[1],ranked[0],ranked[2]]; const cls=['p2','p1','p3'], place=[2,1,3];
  const ov=$('#finalOv');
  ov.innerHTML=`<div class="burstRays"></div><div class="final">
    <h2>HOÀN THÀNH ${R.label}</h2><h1>${S.round==='main'?'NHÀ VÔ ĐỊCH':'BẢNG XẾP HẠNG'}</h1>
    <div class="podium">${top.map((t,k)=>t?`<div class="pod ${cls[k]}">${place[k]===1?`<div class="crown">${ICON.crown}</div>`:''}<div class="who" style="color:${shade(t.color,-30)}">${esc(t.name)}</div><div class="pts">${t.score}</div><div class="blk">${place[k]}</div></div>`:'').join('')}</div>
    ${ranked.length>3?`<div class="rest">${ranked.slice(3).map((t,k)=>`<span>#${k+4} ${esc(t.name)} · ${t.score}</span>`).join('')}</div>`:''}
    <div class="mBtns">${S.round==='warm'?'<button class="btn gold" id="fNext">SANG VÒNG CHÍNH THỨC ➜</button>':''}<button class="btn ghost" id="fHome">VỀ MÀN HÌNH CHÍNH</button></div></div>`;
  ov.classList.add('show'); SFX.win(); rain(260); setTimeout(()=>burst(innerWidth/2,innerHeight*.45,160,1.3,1.3),1000);
  const n=$('#fNext'); if(n)n.onclick=()=>{ov.classList.remove('show');startRound('main');};
  $('#fHome').onclick=()=>{ov.classList.remove('show');switchScreen('intro');};
}

/* ---- misc controls ---- */
function switchScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('show',s.id===id)); if(id==='intro')renderTeamInputs(); }
$('#btnHome').onclick=()=>confirmBox('Về màn hình chính?','Tiến trình của vòng hiện tại sẽ không được lưu (điểm vẫn giữ).',()=>switchScreen('intro'));
$('#btnReveal').onclick=()=>confirmBox('Mở tất cả các ô?','Dùng khi kết thúc vòng để khán giả xem toàn bộ đáp án. Không cộng điểm.',revealAll);
function revealAll(){ S.lock=true; S.tiles.forEach((t,i)=>{ if(t.state==='down'){ setTimeout(()=>{ const e=tileEl(i); e.classList.add(t.t==='gift'?'gift-open':'up'); t.state=t.t==='gift'?'gift-open':'up'; SFX.flip(); const f=e.querySelector('.fit'); if(f)setTimeout(()=>fitEl(f),40); }, i*90); } }); setTimeout(()=>{S.lock=false;updateProgress();},S.tiles.length*90+300); }
$('#btnSound').onclick=()=>{ S.sound=!S.sound; setSoundIcon(); };
$('#btnFull').onclick=toggleFull;
function toggleFull(){ try{ if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); }catch(e){} }
function confirmBox(title,text,yes){
  const ov=$('#boxOv'); ov.innerHTML=`<div class="box"><h3>${title}</h3><p>${text}</p><div class="mBtns" style="margin-top:0"><button class="btn ghost" id="cNo">Huỷ</button><button class="btn" id="cYes">Đồng ý</button></div></div>`;
  ov.classList.add('show'); $('#cNo').onclick=()=>ov.classList.remove('show'); $('#cYes').onclick=()=>{ov.classList.remove('show');yes();};
}
function showHelp(){
  const ov=$('#boxOv'); ov.innerHTML=`<div class="box" style="max-width:44vw"><h3>Hướng dẫn nhanh cho MC</h3>
    <div class="help">• Đội đang chơi gọi <b>số ô</b>, MC bấm lật 2 ô.<br>• <b>Ghép đúng</b>: +${POINTS} điểm và đội được <b>chơi tiếp</b>.<br>• <b>Sai</b>: hai ô tự úp lại, tự chuyển lượt sang đội kế.<br>• <b>Hộp quà</b>: mở ngay khi lật; MC công bố quà và cộng/trừ điểm nhanh trên màn hình quà.<br>• Bấm vào thẻ đội để chọn đội đang chơi; rê chuột vào thẻ đội để chỉnh điểm thủ công.<br><br>
    <kbd>N</kbd> đổi lượt &nbsp; <kbd>Space</kbd>/<kbd>Enter</kbd> đóng bảng thông báo &nbsp; <kbd>F</kbd> toàn màn hình &nbsp; <kbd>M</kbd> tắt/bật âm thanh</div>
    <div class="mBtns"><button class="btn" id="cNo">Đã hiểu</button></div></div>`;
  ov.classList.add('show'); $('#cNo').onclick=()=>ov.classList.remove('show');
}
function showSettings(){
  const ov=$('#boxOv'); ov.innerHTML=`<div class="box" style="max-width:46vw"><h3>Tuỳ chỉnh hình ảnh</h3>
    <div class="row"><span>Logo sự kiện / Amway<small>PNG nền trong suốt, hiện ở màn hình chính & thanh trên</small></span><span><label class="btn ghost" style="display:inline-block">Chọn ảnh<input type="file" accept="image/*" id="upLogo"></label></span></div>
    <div class="row"><span>Ảnh nền (key visual)<small>Ảnh 16:9 tạo bằng AI, phủ mờ dưới hiệu ứng</small></span><span><label class="btn ghost" style="display:inline-block">Chọn ảnh<input type="file" accept="image/*" id="upBg"></label></span></div>
    <div class="row" style="border:0"><span>Xoá ảnh đã chọn</span><button class="btn ghost" id="clrImg">Xoá</button></div>
    <div class="mBtns"><button class="btn" id="cNo">Xong</button></div></div>`;
  ov.classList.add('show'); $('#cNo').onclick=()=>ov.classList.remove('show');
  const rd=(inp,key)=>inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ store.set(key,r.result); applyImages(r.result&&key==='logo'?r.result:undefined); applyImages(); }; r.readAsDataURL(f); };
  rd($('#upLogo'),'logo'); rd($('#upBg'),'bg');
  $('#clrImg').onclick=()=>{ try{localStorage.removeItem('ocgt_logo');localStorage.removeItem('ocgt_bg')}catch(e){} memImg={}; applyImages(); };
}
let memImg={};
function applyImages(){
  const logo=store.get('logo',null)||memImg.logo, bg=store.get('bg',null)||memImg.bg;
  ['#logoIntro','#logoTop'].forEach(s=>{const e=$(s); if(logo){e.src=logo;e.classList.add('on')}else e.classList.remove('on');});
  const b=$('#bgImage'); if(bg){b.style.backgroundImage=`url(${bg})`;b.classList.add('on')}else b.classList.remove('on');
}
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(k===' '||k==='enter'){ e.preventDefault(); if($('#matchOv').classList.contains('show'))closeMatch(); else if($('#giftOv').classList.contains('show')&&$('#gStage.open')){ $('#giftOv').classList.remove('show'); S.lock=false; } }
  if(k==='n'&&$('#game').classList.contains('show')&&!S.lock)nextTeam();
  if(k==='f')toggleFull();
  if(k==='m'){S.sound=!S.sound;setSoundIcon();}
  if(k==='escape')$('#boxOv').classList.remove('show');
});

/* ================= BOOT ================= */
initTeams(); renderTeamInputs(); buildBackground(); setSoundIcon(); applyImages();
sizeCanvas(); parts=Array.from({length:70},()=>spawnPart(true)); loopParts();
</script>
</body>
</html>
